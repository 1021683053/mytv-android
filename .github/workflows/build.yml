name: Build APK

on:
  # 推送 tag（v开头）时自动构建，如 v3.3.10
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build TV debug APK
        run: |
          chmod +x gradlew
          ./gradlew :tv:assembleOriginalDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-original-debug-${{ github.ref_name }}
          path: tv/build/outputs/apk/original/debug/*.apk
          retention-days: 14

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: tv/build/outputs/apk/original/debug/*.apk
          generate_release_notes: true
