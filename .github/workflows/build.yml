name: Build APK

on:
  # 推送 tag（v开头）时自动构建，如 v3.3.10
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 从 Secrets 恢复签名密钥（未配置时跳过，产物为未签名 release）
      - name: Restore signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          cat > key.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build TV release APK
        run: |
          chmod +x gradlew
          ./gradlew :tv:assembleOriginalRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-original-release-${{ github.ref_name }}
          path: tv/build/outputs/apk/original/release/*.apk
          retention-days: 14

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: tv/build/outputs/apk/original/release/*.apk
          generate_release_notes: true
