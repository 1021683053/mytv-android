name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.3)'
        required: true

permissions:
  contents: write

# media3 说明：
# media3 由本地 fork (minyoad/media) 导出为预编译 AAR 并随仓库提交（tv/libs/media3-*.aar），
# 构建无需再检出外部 media3 源码，本仓库完全自包含。
#
# 发布流程（由 release.sh 驱动）：
#   release.sh 修改 versionName -> commit -> 创建 v<versionName> tag -> push 当前分支 + tag
#   本工作流按 tag 编译 APK。versionName 含 "beta" 时标记为 prerelease。

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出主仓库（含 media3 AAR）
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，确保能找到所有 tag

      # 2. 切换到指定 TAG
      - name: Checkout tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          echo "Target TAG: $TAG"
          git fetch --tags --force
          git checkout "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # 3. 配置 JDK（21，与本地一致）
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. 赋予 Gradle 可执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. 导入签名密钥（与主干相同的 Secrets；未配置时跳过，产物为未签名 release）
      - name: Decode signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          cat > key.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # 6. 编译 Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 7. 验证 APK 签名（未配置密钥时跳过）
      - name: Check APK signature
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          echo "Using apksigner: $apksigner"
          find tv/build/outputs/apk/release -name '*.apk' | while read apk; do
            echo "🔍  Checking $apk"
            "$apksigner" verify --verbose "$apk"
            if [ $? -ne 0 ]; then exit 1; fi
          done

      # 8. 定位 APK 文件
      - name: Locate APK
        id: apk
        run: |
          apk_path=$(find tv/build/outputs/apk/release -name '*.apk' | head -n1)
          [ -z "$apk_path" ] && { echo "❌ APK not found"; exit 1; }
          echo "Found APK: $apk_path"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      # 9. 检测是否为 Beta 版本（依据 tag 名，tag = v<versionName>）
      - name: Check if Beta
        id: check_beta
        run: |
          if [[ "${{ env.TAG }}" == *"beta"* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
            echo "📢 Detected Beta release"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      # 10. 发布到 GitHub Release (自动创建或更新)
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: false
          prerelease: ${{ steps.check_beta.outputs.is_beta == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
